name: Deployment contract

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEMO_VERSION: 2.3.5
  TRIVY_VERSION: v0.72.0

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: Verify localized deployment content
        shell: bash
        run: |
          if rg -n -i \
            'TrueWatchTech/observability-demo|cherrycove/observability-demo|ghcr|demo-control-token|DEMO_CONTROL_TOKEN|sessionStorage|\blatest\b|\bTrueWatch\b|ap1-console\.truewatch\.com|pubrepo\.truewatch\.com/chartrepo/datakit|AWS_REGION|--region' \
            content; then
            echo 'obsolete deployment contract found in workshop content' >&2
            exit 1
          fi
          if rg -n 'ap1-console\.truewatch\.com' static/attachments; then
            echo 'obsolete console deep link found in workshop attachments' >&2
            exit 1
          fi
          grep -q 'https://console.guance.com/tracing/link/all' \
            static/attachments/chapter-07/product-service-operational-quality-dashboard.json
          for locale in en zh-CN zh-TW; do
            grep -q 'https://auth.guance.com/businessRegister' "content/01-introduction/index.${locale}.md"
            chapter_index="content/02-setup/index.${locale}.md"
            grep -q 'scripts/workshop.sh install' "$chapter_index"
            grep -q 'scripts/workshop.sh install --yes' "$chapter_index"
            grep -q 'scripts/workshop.sh install --upgrade-existing-datakit' "$chapter_index"
            grep -q 'https://github.com/GuanceDemo/observability-demo.git' "$chapter_index"
            grep -q 'export DEMO_VERSION="2.3.5"' "$chapter_index"
            for variable in EKS_CLUSTER_NAME DATAWAY_URL RUM_APPLICATION_ID GUANCE_WORKSPACE_ID; do
              grep -q "$variable" "$chapter_index"
            done
            grep -q 'GuanceDemo/observability-demo' "content/02-setup/01-datakit-configuration/index.${locale}.md"
            grep -q 'values-eks.yaml' "content/02-setup/03-deploy-demo-application/index.${locale}.md"
            grep -q 'https://console.guance.com/' "content/02-setup/03-deploy-demo-application/index.${locale}.md"
            grep -q '2.3.5' "content/02-setup/02-create-client-application/index.${locale}.md"

            agent_chapter="content/04-ai-ops/01-toby-ai-agent-teams/index.${locale}.md"
            cve_chapter="content/04-ai-ops/02-scheduled-cve-inspection/index.${locale}.md"
            ai_ops_index="content/04-ai-ops/index.${locale}.md"
            test -f "$cve_chapter"
            grep -q '^weight : 42$' "$cve_chapter"
            case "$locale" in
              en) cve_agent_name='CVE Gap Analysis and Evidence Attribution Agent' ;;
              zh-CN) cve_agent_name='CVE 查漏与证据归因 Agent' ;;
              zh-TW) cve_agent_name='CVE 查漏與證據歸因 Agent' ;;
            esac
            grep -Fq "$cve_agent_name" "$ai_ops_index"
            grep -Fq "$cve_agent_name" "$cve_chapter"
            if rg -q 'TOKEN_DURATION|24-hour|24 小时|24 小時' "$agent_chapter" "$cve_chapter"; then
              echo "the Workshop must use the installer default token duration: $locale" >&2
              exit 1
            fi
            if grep -q 'install-obs-agent-eks-node-demo.sh --cleanup' "$agent_chapter"; then
              echo "cleanup must remain in the CVE chapter: $agent_chapter" >&2
              exit 1
            fi
            grep -q 'install-obs-agent-eks-node-demo.sh --cleanup' "$cve_chapter"
            for token in \
              "$TRIVY_VERSION" \
              trivy-cluster-scan \
              observability-demo \
              09:00 \
              Asia/Shanghai \
              --authorized-scope \
              vuln \
              KUBECONFIG \
              'node collector' \
              'Kubernetes Job' \
              cve-inspection-YYYY-MM-DD.md \
              trivy-k8s.json \
              scan-manifest.json \
              FixedVersion \
              SBOM \
              scanner_direct \
              metadata_observed \
              filesystem_observed \
              advisory_correlated \
              installed_version \
              affected/fixed \
              unknown \
              BLOCKED \
              PARTIAL \
              'JAR Manifest' \
              PoC \
              NetworkPolicy \
              RBAC; do
              grep -q -- "$token" "$cve_chapter"
            done
            test "$(grep -c '^### ' "$cve_chapter")" -eq 6
            test "$(rg -o '/static/static-29/[0-9]{2}\.png' "$cve_chapter" | wc -l | tr -d ' ')" -eq 5
            for image_number in 01 02 03 04 05; do
              grep -q "/static/static-29/${image_number}.png" "$cve_chapter"
            done
            if rg -n 'b496978ffedab433e716e2f43ed63f08ffc82821|2026\.07\.02|AI_SKILLS_COMMIT|SKILL_PACKAGE|GuanceCloud/ai-skills|git archive|Download file' "$cve_chapter"; then
              echo "obsolete manual Skill packaging found in $cve_chapter" >&2
              exit 1
            fi
            if rg -n -i 'Codex|obsyAgentTeams MCP|\blatest\b|自动修复|自動修復' "$cve_chapter"; then
              echo "forbidden content found in $cve_chapter" >&2
              exit 1
            fi
          done
      - name: Verify optional CVE chapter screenshots
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct

          image_dir = Path("static/static-29")
          images = sorted(image_dir.glob("*.png")) if image_dir.is_dir() else []
          total_size = 0

          if images:
              expected = {f"{number:02d}.png" for number in range(1, 6)}
              actual = {image.name for image in images}
              if not actual <= expected:
                  raise SystemExit(
                      f"unexpected image in static/static-29: {sorted(actual - expected)}"
                  )

          for image in images:
              data = image.read_bytes()
              if len(data) < 24 or data[:8] != b"\x89PNG\r\n\x1a\n" or data[12:16] != b"IHDR":
                  raise SystemExit(f"not a valid PNG: {image}")
              width, height = struct.unpack(">II", data[16:24])
              size = len(data)
              if max(width, height) > 3200:
                  raise SystemExit(f"image exceeds 3200 px: {image} ({width}x{height})")
              if size > 800 * 1024:
                  raise SystemExit(f"image exceeds 800 KiB: {image} ({size} bytes)")
              total_size += size

          if total_size > 3 * 1024 * 1024:
              raise SystemExit(f"static/static-29 exceeds 3 MiB ({total_size} bytes)")
          PY
      - name: Clone the pinned official demo release
        run: |
          git clone --branch "v${DEMO_VERSION}" --depth 1 \
            https://github.com/GuanceDemo/observability-demo.git /tmp/observability-demo
      - name: Verify demo scripts and Helm profile
        working-directory: /tmp/observability-demo
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          scripts/test-workshop.sh
          helm lint charts/observability-demo \
            --values charts/observability-demo/values-eks.yaml \
            --set-string rum.enabled=true \
            --set-string rum.applicationId=test-rum \
            --set-string observability.clusterName=test-cluster \
            --set-string observabilityConsole.url=https://console.guance.com/ \
            --set-string observabilityConsole.workspaceId=test-workspace
          helm template demo charts/observability-demo \
            --namespace observability-demo \
            --values charts/observability-demo/values-eks.yaml \
            --set-string rum.enabled=true \
            --set-string rum.applicationId=test-rum \
            --set-string observability.clusterName=test-cluster \
            --set-string observabilityConsole.url=https://console.guance.com/ \
            --set-string observabilityConsole.workspaceId=test-workspace \
            >/tmp/workshop-rendered.yaml
          grep -q 'pubrepo.jiagouyun.com/demo/observability-demo-gateway-service:2.3.5' /tmp/workshop-rendered.yaml
          grep -q 'cluster_name_k8s:test-cluster' /tmp/workshop-rendered.yaml
          grep -A20 'name: DATAKIT_PROVIDER' /tmp/workshop-rendered.yaml | grep -q 'guance'
          grep -A20 'name: OBSERVABILITY_CONSOLE_URL' /tmp/workshop-rendered.yaml | grep -q 'https://console.guance.com/'
      - name: Verify public Harbor images
        run: |
          for service in gateway order inventory payment; do
            docker manifest inspect \
              "pubrepo.jiagouyun.com/demo/observability-demo-${service}-service:${DEMO_VERSION}" \
              >/dev/null
          done
