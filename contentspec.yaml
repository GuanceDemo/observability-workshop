version: 2.0

defaultLocaleCode: en-US
localeCodes:
  - en-US
  # - pt
  - zh-CN
  - zh-TW

infrastructure:
  cloudformationTemplates:
    - templateLocation: static/truewatch-stack.yaml
      label: truewatch-stack
      # participantVisibleStackOutputs:
      #   - IdeUrl
      #   - IdePassword

awsAccountConfig:
  accountSources:
    - WorkshopStudio
  participantRole:
    iamPolicies:
      - static/iam-policy.json
    managedPolicies:
      # - "arn:aws:iam::aws:policy/AdministratorAccess"
      - "arn:aws:iam::aws:policy/ReadOnlyAccess"
  regionConfiguration:
    minAccessibleRegions: 1
    maxAccessibleRegions: 1
    deployableRegions:
      optional:
        - ap-northeast-1
        - ap-southeast-1
        - ap-southeast-2
        - eu-central-1
        - eu-west-1
        - us-east-1
        - us-east-2
        - us-west-2
